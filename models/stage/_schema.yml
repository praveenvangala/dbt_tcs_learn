version: 2
 
models:
  
  - name: stg_customers
    description: staging layer for customers data
    columns:
      - name: customer_id
        description: primary id of the model
        data_tests:
          - unique
          - not_null
      - name: name
        description: customer name details
 
  - name: stg_locations
    description: staging layer for lcoations data
    columns:
      - name: location_id
        description: primary id of the model
        data_tests:
          - unique
          - not_null

  - name: stg_orders
    description: staging layer for orders data
    columns:
      - name: order_id
        description: primary id of the model
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: foreign id to stg_customers
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
              config:
                store_failures: true
      - name: location_id
        description: foreign id to stg_locations
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_locations')
              field: location_id
              config:
                store_failures: true         
      - name: day_level
        description: '{{ doc("comment") }}' 
      config:
        access: private
        group: finance

  - name: stg_order_items
    description: staging layer for order item data
    columns:
      - name: order_item_id
        description: primary id of the model
        data_tests:
          - unique
          - not_null
      - name: order_id
        description: fk for order table
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id
              config:
                store_failures: true

